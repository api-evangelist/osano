docs_defects:
- finding: >-
    The published Unified Consent Core API reference points readers at a NON-PRODUCTION console host.
    Its Authentication section links the UC configuration list as
    https://my.osano.dev/unified-consent/configs (a .dev host, HTTP 200) while the Cookie Consent
    sections in the same document link https://my.osano.com/consent/panels and
    https://my.osano.com/api-keys. A developer following the UC instructions lands on the wrong
    environment.
  evidence:
  - url: https://developers.osano.com/redocusaurus/unified-consent-core-api.yaml
    status: 200
    detail: 'info.description, Authentication section: "https://my.osano.dev/unified-consent/configs".'
  - url: https://my.osano.dev/unified-consent/configs
    status: 200
  note: >-
    Recorded as a documentation defect, not as a published sandbox — Osano documents no test/sandbox
    environment, no test keys and no test-vs-live key prefixes anywhere, so no sandbox artifact was
    written.
