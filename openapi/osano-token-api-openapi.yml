openapi: 3.2.0
info:
  title: Unified Consent Core Token API
  description: '> **📍 Regional Distribution**

    > The UC Core API is regionally distributed.'
  version: 2.0.0
servers:
- url: https://uc.api.osano.com
security:
- ucApiKey: []
tags:
- name: Token
paths:
  /v2/token/create:
    post:
      description: Creates a token for UC
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                configId:
                  type: string
                customerId:
                  type: string
      responses:
        '200':
          description: Default Response
      tags:
      - Token
      summary: Create token create
      x-summary-source: derived
      operationId: postV2TokenCreate
      x-operation-id-source: derived
components:
  securitySchemes:
    ucApiKey:
      description: Unified Consent API key
      type: apiKey
      name: x-uc-api-key
      in: header
    osanoApiKey:
      description: Osano API key
      type: apiKey
      name: x-osano-api-key
      in: header
