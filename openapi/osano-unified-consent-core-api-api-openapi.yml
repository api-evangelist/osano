openapi: 3.2.0
info:
  title: Unified Consent Core API
  description: '> **📍 Regional Distribution**

    > The UC Core API is regionally distributed.'
  version: 2.0.0
servers:
- url: https://uc.api.osano.com
security:
- ucApiKey: []
tags:
- name: Unified Consent Core API
paths:
  /:
    get:
      description: Public endpoint for health check purposes
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  commit:
                    type: string
                  branch:
                    type: string
      tags:
      - Unified Consent Core API
      summary: Get
      x-summary-source: derived
      operationId: getRoot
      x-operation-id-source: derived
components:
  securitySchemes:
    ucApiKey:
      description: Unified Consent API key
      type: apiKey
      name: x-uc-api-key
      in: header
    osanoApiKey:
      description: Osano API key
      type: apiKey
      name: x-osano-api-key
      in: header
