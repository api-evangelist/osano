            usVariantMapping:
              type: object
              description: 'Maps US jurisdictions to the consent banner variant they get. Keys are lower-case state codes such as `us-ca`, plus the reserved key `defaults` for US jurisdictions the mapping does not list. Values are `one` (banner format 1, consent implied) or `three` (banner format 3, explicit consent). Unknown keys or values are rejected with `400`; there is no country-wide `us` key, use `defaults`. While a mapping is stored it is authoritative for every US visitor: a jurisdiction it does not list gets `defaults`, or `one` when `defaults` is unset. Osano''s curated per-state defaults and the legacy `ccpaRelaxed` boolean do not apply. Listing `us-ca` alone therefore gives California format 3 and every other state format 1, including states with active privacy laws. `ccpaRelaxed` applies only when no mapping is stored (`false` — curated per-state defaults; `true` — format 1 for all US states) and is never written by this field. A mapping with no usable entries is not stored, which hands control back to `ccpaRelaxed`. Requires the `cmpUsJurisdictionCustomization` plan entitlement: sending a non-empty mapping without it is rejected with `403` (`FE0004`), and a mapping stored before a plan downgrade is dropped on the next update or publish.'
              additionalProperties:
                type: string
                enum:
                - one
                - three
              properties:
                defaults:
                  type: string
                  enum:
                  - one
                  - three
              example:
                us-ca: three
                us-tx: three
