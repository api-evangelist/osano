    CmpConfigLimitParam:
      name: limit
      required: false
      in: query
      description: The number of items to return.
      schema:
        type: integer
        format: int32
        maximum: 1000
        default: 100
    domainsParam:
      name: domains
      required: false
      in: query
      description: 'A comma-separated list of domains to filter results by. If your domain has non-standard characters, please use Punycode encoding. The optional prefix can be used to specify how the filter is applied: any (default) - return results that match any of the specified domains; not - return results that do not match any of the specified domains; all - return results that match all of the specified domains. Example: "any:example.com,another-example.org" or "not:example.com,another-example.org" or "all:example.com,another-example.org"'
      schema:
        type: string
        pattern: ^(?:(any|all|not):)?((?:(?!-)(?:xn--|_)?[A-Za-z\d-]{0,61}[A-Za-z\d]\.)+[A-Za-z]{2,6})(?:,((?:(?!-)(?:xn--|_)?[A-Za-z\d-]{0,61}[A-Za-z\d]\.)+[A-Za-z]{2,6}))*$
      examples:
        singleDomain:
          value: example.com
          summary: This example filters results to only include those associated with the specified domain.
        multipleDomains:
          value: example.com, another-example.org, sub.domain.co.uk
          summary: This example filters results to include those associated with any of the specified domains.
    limitParam:
      name: limit
      required: false
      in: query
      description: The number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    cmpDiscoveriesStoreTypeParam:
      name: type
      in: query
      description: The type of Discovery to be returned. If omitted, only cookie type discoveries are returned.
      schema:
        type: string
        default: cookie
        enum:
        - cookie
        - script
        - iframe
        - localStorage
    nextTokenParam:
      name: next
      required: false
      in: query
      description: The pagination token from the previous request.
      schema:
        type: string
    orgIdsParam:
      name: orgIds
      required: false
      in: query
      description: 'A comma-separated list of organization UUIDs to filter results by. The optional prefix can be used to specify how the filter is applied: any (default) - return results that match any of the specified org IDs; na - return results that do not match any of the specified org IDs; all - return results that match all of the specified org IDs. Example: "any:uuid1,uuid2" or "not:uuid1,uuid2" or "all:uuid1,uuid2"'
      schema:
        type: string
        pattern: ^(?:(any|all|not):)?((?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:,[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})*)$
      examples:
        noPrefix:
          value: 123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: This example omits the prefix, which defaults to "any", to return results that match any of the specified org IDs.
        any:
          value: any:123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: This example uses the "any" prefix to return results that match any of the specified org IDs.
        all:
          value: all:123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: This example uses the "all" prefix to return results that match all of the specified org IDs.
        not:
          value: not:123e4567-e89b-12d3-a456-426614174000,987e6543-e21b-12d3-a456-426614174999
          summary: This example uses the "not" prefix to return results that do not match any of the specified org IDs.
