method: searched
source: >-
  https://developers.osano.com/cmp/mobile-sdks/ios/changelog and
  https://developers.osano.com/cmp/mobile-sdks/android/changelog
scheme: semver
note: >-
  Osano publishes dated changelogs for its client SDKs but NOT for its REST APIs. There is no
  changelog for the Customer REST API (v1) or the Unified Consent Core API (v2) anywhere on
  developers.osano.com, so an integrator has no record of what changed in the API surface. What
  follows is the recent window of the two most actively released SDKs; the entries are quoted from
  the provider's own changelog pages. Both lines ship monthly and track each other feature-for-
  feature (jurisdiction getter, server-configured dialog layout, property-driven DNS opt-out land in
  both within weeks), which is a genuine maintenance signal.
