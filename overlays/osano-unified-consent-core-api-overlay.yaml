overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Osano Unified Consent Core API
  version: 1.0.0
extends: ../openapi/osano-unified-consent-core-api-openapi.yml
x-provenance:
  generated: '2026-08-26'
  method: generated
  source: >-
    Authored by API Evangelist against the provider's own published spec
    (https://developers.osano.com/redocusaurus/unified-consent-core-api.yaml, retrieved 2026-08-26,
    HTTP 200). This spec is machine-generated (Fastify/TypeBox) and ships with NO operationIds, NO
    tags and anonymous def-N schemas, which makes it hard for a client generator or an agent to
    address. This overlay adds operationIds and tags derived from each path+method and from the
    operation descriptions in the spec itself — no operation is invented. The original spec is never
    mutated.
actions:
- target: $.info
  description: Add contact, terms and reference metadata the published spec omits.
  update:
    contact:
      name: Osano Support
      url: https://docs.osano.com/en-US/osano/directories
    termsOfService: https://osano.trusthub.com/terms
    x-api-reference: https://developers.osano.com/uc/core-api/openapi
    x-regional-distribution: >-
      Requests originating from the United States are processed in us-east-1; requests from all other
      regions are processed in eu-central-1.
- target: $
  description: Declare tags this spec omits entirely.
  update:
    tags:
    - name: consents
      description: Submit, check and read unified consent for a subject.
    - name: subjects
      description: Create, verify, read and merge consent subjects.
    - name: collections
      description: Privacy protocol collections resolved by config and jurisdiction.
    - name: config
      description: Unified Consent configuration and sessions.
    - name: system
      description: Health and token operations.
    externalDocs:
      description: Osano Unified Consent documentation
      url: https://developers.osano.com/uc/
- target: $.paths['/v2/consents'].post
  description: Name and tag the consent submission operation; record that it is append-only.
