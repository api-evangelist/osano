note: >-
  Osano's market is data privacy compliance, and the domain standards for that market are visible in
  the CONTRACT rather than only on the marketing pages: a dedicated Global Privacy Control consent
  endpoint, a gpcSupport switch on the CMP configuration schema, and an IAB TCF interoperability
  constraint written into a field description. Recorded here with the exact spec locations. Osano is
  NOT an OAuth/OIDC provider and does not implement RFC 9457, JSON:API, OData, SCIM or FAPI, and it
  is not penalised for standards its market does not use.
conformance:
- id: gpc
  name: Global Privacy Control
  conforms: true
  domain_standard: true
  evidence:
  - spec: openapi/osano-unified-consent-core-api-openapi.yml
    location: paths./v2/consents/gpc.post
    detail: >-
      Dedicated endpoint "Create and insert a gpc consent". The consent request body carries
      `origin?: 'api' | 'gpc'` — "If submitting a GPC consent, use 'gpc', otherwise use 'api'" — so
      the GPC signal is a first-class, distinguishable provenance value on every stored consent, not
      an inference.
  - spec: openapi/osano-customer-rest-api-openapi.yml
    location: components.schemas.CmpConfig ... gpcSupport
    detail: >-
      "When set to `true`, the Global Privacy Control (GPC) signal is honored." Documented at
      https://docs.osano.com/global-privacy-controls-gpc. The banner/widget palette additionally
      exposes dedicated GPC opt-out indicator styling (dialogGpcBackgroundColor, gpcBorderColor and
      siblings), i.e. GPC has its own rendered UI state.
- id: iab-tcf
  name: IAB Transparency & Consent Framework (TCF) 2.x / 2.2
  conforms: partial
  domain_standard: true
  evidence:
  - spec: openapi/osano-customer-rest-api-openapi.yml
    location: components.schemas.CmpConfig (Microsoft UET field description)
    detail: >-
      "Please note that this signal is incompatible with the use of IAB TCF 2.x consent signals." —
      the contract states an interoperability constraint against TCF 2.x, which only makes sense
      because the CMP emits TCF signals.
  - spec: openapi/osano-customer-rest-api-openapi.yml
    location: paths./v1/cookie-consent/audit-log.get parameter changeType
    detail: >-
      `iab` is one of five enumerated audit-log change types (text_customization, style, iab,
      setting, rule) — IAB configuration is a tracked, auditable dimension of a CMP configuration.
  - docs: https://developers.osano.com/cmp/mobile-sdks/android/installation
    detail: >-
      "The SDK requires Android API 23 or higher, with API 26+ needed for IAB TCF 2.2 support."
  note: >-
    Marked `partial` deliberately: the public REST contract references TCF but exposes no TCF vendor
    list, purpose, or TC-string field, so conformance is asserted by the CMP runtime rather than
    demonstrable from the published spec.
