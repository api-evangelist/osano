- name: Osano Unified Consent Core API
  description: >-
    REST API for the Osano Unified Consent platform — submit and check consents, retrieve unified
    consent and consent profiles for a subject, list privacy protocol collections, create and verify
    subject profiles by email or SMS, merge anonymous and verified subjects, mint UC tokens and read
    sessions. Regionally distributed (us-east-1 for US traffic, eu-central-1 for everything else).
    Authenticated with a Unified Consent API key (x-uc-api-key) or an Osano API key
    (x-osano-api-key) for subject-mutating routes.
  humanURL: https://developers.osano.com/uc/core-api/openapi
  baseURL: https://uc.api.osano.com
  tags:
  - Consent Management
  - Unified Consent
  - Preference Management
  - Global Privacy Control
  properties:
  - type: OpenAPI
    url: openapi/osano-unified-consent-core-api-openapi.yml
  - type: Documentation
