aid: osano
name: Osano
description: >-
  Osano is a data privacy platform, founded in 2018 and headquartered in Austin, Texas, that helps
  organizations build and run privacy programs across consent management, subject rights (DSAR)
  automation, data mapping and discovery, privacy assessments, and vendor privacy risk management.
  It is a certified B Corporation and Public Benefit Corporation, and backs the platform with a "No
  Fines. No Penalties." guarantee covering GDPR, CPRA/CCPA and 95+ global privacy laws. Developers
  reach the platform through two public REST APIs — the Osano Customer REST API (api.osano.com) for
  cookie consent configurations, rules, audit logs, subject rights requests, action items and data
  discovery, and the Unified Consent Core API (uc.api.osano.com) for collecting, checking and
  merging consent for subjects across cookie and non-cookie touchpoints — plus a browser CMP
  JavaScript API, iOS/Android/React Native SDKs, a Unified Consent JS SDK, and outbound webhooks.
  Osano also operates OsanoBot, a compliance scanning crawler that authenticates itself with Web Bot
  Auth (RFC 9421 HTTP Message Signatures) and publishes its Ed25519 key directory publicly.
