- name: Osano CMP JavaScript API
  description: >-
    Browser-side JavaScript API for the Osano Consent Management Platform, loaded from cmp.osano.com.
    Exposes functions (showDialog, showDrawer, getConsent, ready, addEventListener), properties (consentModel,
    jurisdiction, gdprApplies, userData) and a documented event surface (osano-cm-consent-saved, osano-cm-script-blocked,
    osano-cm-initialized and others) so sites can react to a visitor's consent status.
  humanURL: >-
    https://developers.osano.com/cmp/javascript-api/developer-documentation-consent-javascript-api
