- name: Subject
  api: Osano Unified Consent Core API
  identifier: subjectRef / subjectId / hashedSubjectId
  operations_paths:
  - GET /v2/subjects/{subjectRef}
  - POST /v2/subjects/merge
  - GET /v2/subjects/{id}/profile
  - POST /v2/subjects/profile
  pii: true
  note: >-
    Addressed three ways — a subject reference, a raw subject id, and a hashed subject id for the
    consent-profile lookup, which is how a browser can read a profile without transmitting the raw
    identifier.
- name: Consent
  api: Osano Unified Consent Core API
  operations_paths:
  - POST /v2/consents
  - POST /v2/consents/gpc
  - GET /v2/consents/check/{subjectId}
  - GET /v2/consents/unified/{subjectRef}
  key_fields: [collections, tags, attributes, origin, jurisdiction]
  note: >-
    origin is 'api' | 'gpc'. attributes auto-populates ipAddress and userAgent (values passed for
    those keys are overwritten). Append-only — no delete/revoke operation exists.
- name: Collection
  api: Osano Unified Consent Core API
  identifier: collectionId
  operations_paths: [GET /v2/collections, 'GET /v2/collections/{collectionId}']
  note: A collection of privacy protocols, resolved per configId and jurisdiction.
- name: UcConfig
  api: Osano Unified Consent Core API
  operations_paths: [GET /v2/config]
- name: Session
