- name: DsarSummary
  api: Osano Customer REST API
  identifier: dsarSummaryId
  operations: [getRequestSummaries, getDsarSummariesByActionItem, addDsarSummary, updateDsarSummary]
  key_fields: [dsarId, dataStore, task, fileName, fileType, manual, created]
- name: PortalMessage
  api: Osano Customer REST API
  identifier: messageId
  operations: [getPortalMessages, postPortalMessage, patchPortalMessage]
