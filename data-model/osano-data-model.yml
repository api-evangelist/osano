entities:
- name: CmpConfig
  api: Osano Customer REST API
  identifier: configId
  operations: [getConfigs, createConfig, getConfig, updateConfig, publishConfig]
  key_fields: [name, mode, domains, orgIds, configuration]
  note: >-
    The `configuration` object is the CMP's whole surface — consent model, jurisdiction behaviour,
    gpcSupport, Google Consent Mode, Microsoft UET, iframe/script blocking, and the full colour
    palette for banner/drawer/DNS dialogs. It is also the id in the CMP script URL
    (cmp.osano.com/{configId}/osano.js).
