- name: CmpAuditEvent
  api: Osano Customer REST API
  operations: [getAuditLog]
  key_fields: [eventTypes, 'metadata.changeType', actor, timestamp]
  note: 'changeType enum: text_customization, style, iab, setting, rule.'
- name: Dsar
  api: Osano Customer REST API
  identifier: dsarId
  operations: [getDsars, createDsars, getDsar, updateDsar, updateIdentityFile]
  key_fields: [dsarDetails, requestType, status, due, created, formId, requestSource, notifyEmail, rejectionReasonCode]
