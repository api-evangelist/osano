plan_quotas_are_not_api_limits:
  note: >-
    The self-service plans do publish product quotas (monthly visitors, users, domains — see
    plans/osano-plans-pricing.yml) and the FAQ notes API access itself is tier-gated ("Open a ticket
    with support to enable API access if you are on a tier that includes API access."), but those are
    entitlements, not request-rate limits.
