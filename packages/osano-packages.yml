source: >-
  registry.npmjs.org metadata endpoints, github.com/osano repository + tag listings via api.github.com,
  the Osano CocoaPods spec repository (github.com/osano/cocoapods-specs), and the Osano developer docs
  install pages (developers.osano.com/cmp/mobile-sdks/*, /uc/js-sdk/).
note: >-
  Osano distributes client SDKs across five channels and only two of them are on a public registry.
  The React Native CMP SDK is on npm under the @osano scope and is current (0.18.6, 2026-08-21). The
  iOS SDK ships through Osano's OWN CocoaPods spec repo rather than the CocoaPods trunk — trunk
  returns "No pod found with the specified name" for OsanoConsentManagerSDK — and the Android SDK
  ships from a private Maven at libraries.osano.com/android, absent from Maven Central. Neither has a
  queryable public registry metadata endpoint, so versions below are read from the provider's own
  published spec/install pages and dated from the spec-repo commit. The Unified Consent JS SDK is
  documented as an npm import (@osano/unified-consent-js-sdk) but returns "Not found" on the public
  npm registry, so a developer reading the docs cannot install it from npm without further access.
